<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NarraFork 故事全景可视化控制台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #14161c; color: #e7e9ee; }
  
  #toolbar { position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(28,31,40,.92); border: 1px solid #2c303c;
    border-radius: 10px; padding: 10px 16px; font-size: 13px; line-height: 1.9;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); backdrop-filter: blur(8px); }
  #toolbar b { color: #9fd0ff; font-size: 14px; }
  .legend span { display: inline-block; margin-right: 12px; font-size: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle; }

  #tip { position: fixed; pointer-events: none; z-index: 20;
    background: rgba(20,22,28,.96); border: 1px solid #3a3f4d; border-radius: 8px;
    padding: 10px 14px; font-size: 13px; max-width: 320px; line-height: 1.6;
    display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  #tip .t { color: #9fd0ff; font-weight: 600; margin-bottom: 6px; font-size: 14px; }

  #container { display: flex; width: 100%; height: 100%; }
  #canvas-panel { flex: 1; height: 100%; position: relative; }
  svg { width: 100%; height: 100%; cursor: grab; }

  #side-panel { width: 480px; height: 100%; background: #1a1d26; border-left: 1px solid #2c303c;
    display: flex; flex-direction: column; z-index: 15; }
  
  .tab-header { display: flex; background: #14161c; border-bottom: 1px solid #2c303c; }
  .tab-btn { flex: 1; padding: 12px 2px; text-align: center; cursor: pointer; color: #8c93a3;
    font-size: 11px; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab-btn.active { color: #9fd0ff; border-bottom-color: #5aa9ff; background: #1a1d26; }
  
  #search-box { padding: 10px 14px; background: #14161c; border-bottom: 1px solid #2c303c; }
  #search-input { width: 100%; padding: 8px 12px; background: #202430; border: 1px solid #2c303c;
    color: #e7e9ee; border-radius: 6px; outline: none; font-size: 13px; }
  #search-input:focus { border-color: #5aa9ff; }

  .panel-content { flex: 1; overflow-y: auto; padding: 14px; }
  
  .card { background: #202430; border: 1px solid #2c303c; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px; transition: transform 0.15s, border-color 0.15s; }
  .card:hover { border-color: #3a3f4d; }
  .card .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px;
    font-weight: 600; margin-bottom: 6px; }
  .tag-未回收 { background: #ff4d4d; color: #fff; }
  .tag-部分回收 { background: #e8c060; color: #14161c; }
  .tag-已回收 { background: #5ad48a; color: #14161c; }
  .tag-里程碑 { background: #ff7676; color: #fff; }
  .tag-高潮 { background: #e8a84a; color: #14161c; }
  .tag-走势 { background: #5aa9ff; color: #14161c; }
  .tag-健康 { background: #5ad48a; color: #14161c; }
  .tag-警告 { background: #e8a84a; color: #14161c; }

  .card .title { font-weight: 600; font-size: 14px; color: #9fd0ff; margin-bottom: 6px; }
  .card .detail { font-size: 12px; color: #b0b8c4; line-height: 1.6; }

  /* 进度条 */
  .bar-bg { background: #14161c; height: 6px; border-radius: 3px; overflow: hidden; margin: 6px 0; }
  .bar-fill { background: linear-gradient(90deg, #5aa9ff, #ff4d4d); height: 100%; }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .metric-item { background: #14161c; padding: 10px; border-radius: 6px; border: 1px solid #2c303c; }
  .metric-item .val { font-size: 18px; font-weight: bold; color: #9fd0ff; }
  .metric-item .lbl { font-size: 11px; color: #8c93a3; margin-top: 2px; }

  /* 已回收折叠面板 */
  details.resolved-section { margin-top: 16px; border: 1px dashed #3a3f4d; border-radius: 8px;
    background: #14161c; padding: 10px; }
  details.resolved-section summary { cursor: pointer; font-size: 13px; font-weight: 600;
    color: #8c93a3; outline: none; user-select: none; padding: 4px 0; }
  details.resolved-section summary:hover { color: #5ad48a; }
  details.resolved-section .resolved-container { margin-top: 10px; }

  .advice-box { background: #14161c; border: 1px solid #3b82f6; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.6; color: #9fd0ff; }

  .link { stroke-opacity: .6; }
  .link-label { fill: #8c93a3; font-size: 11px; pointer-events: none; }
  .node circle { stroke: #14161c; stroke-width: 2px; cursor: pointer; }
  .node text { fill: #e7e9ee; font-size: 13px; pointer-events: none; text-anchor: middle; }
  .faded { opacity: .12; }
</style>
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<div id="toolbar">
  <b>NarraFork 全景控制台</b> <span style="color:#8c93a3;font-size:11px;">(v2.0 融合版)</span><br>
  <div class="legend" style="margin-top:4px;">
    <span><i class="dot" style="background:#5aa9ff"></i>柳家</span>
    <span><i class="dot" style="background:#e8a84a"></i>天影阁</span>
    <span><i class="dot" style="background:#e86090"></i>戴家</span>
    <span><i class="dot" style="background:#a060e8"></i>上京畿/朝廷</span>
    <span><i class="dot" style="background:#5ad48a"></i>其他势力</span>
  </div>
</div>

<div id="tip"></div>

<div id="container">
  <div id="canvas-panel">
    <svg id="svg"></svg>
  </div>
  
  <div id="side-panel">
    <div class="tab-header">
      <div class="tab-btn active" onclick="switchTab('health')">体检仪表盘</div>
      <div class="tab-btn" onclick="switchTab('audit')">质量审计</div>
      <div class="tab-btn" onclick="switchTab('wave')">8章走势</div>
      <div class="tab-btn" onclick="switchTab('top')">冲突Top10</div>
      <div class="tab-btn" onclick="switchTab('fubi')">伏笔库</div>
      <div class="tab-btn" onclick="switchTab('miles')">里程碑</div>
    </div>
    
    <div id="search-box">
      <input type="text" id="search-input" placeholder="搜索卡片内容或角色..." oninput="handleSearch(this.value)">
    </div>
    
    <div class="panel-content" id="panel-body">
      <!-- 动态注入 -->
    </div>
  </div>
</div>

<script>
const relationData = {"_说明":"人物关系数据。nodes=人物，links=关系。每条关系标注 type(关系类型)、label(显示文字)、since(哪一章建立/变化)。group 用于节点配色分组。","_更新到":"卷六·第21章","nodes":[{"id":"安","name":"柳慕安","group":"主角","size":"big","desc":"照元后期，癸水器修，29岁（实岁，与戴清宁、秋月岚同岁）。与戴清宁在沉水州西南深山古灵穴大阵长闭关冲刺照元后期巅峰关隘（已闭关近两年）。"},{"id":"清宁","name":"戴清宁","group":"主角","size":"big","desc":"照元后期，太阴剑修，29岁（实岁，与柳慕安、秋月岚同岁）。与柳慕安在沉水州西南深山古灵穴大阵长闭关冲刺照元后期巅峰关隘（已闭关近两年）。"},{"id":"泠","name":"柳泠","group":"主角","size":"big","desc":"凝脉后期，阵修，24-25岁（比柳慕安小5岁）。在连州观星峰星罗台大长老薛宛辞门下清修，深得师尊喜爱与器重，专修星象推演与核心叠阵。"},{"id":"岚","name":"秋月岚","group":"主角","size":"big","desc":"炁修·合象中期（伴生奇宝【灵韵】），29岁（实岁）。与江澜回云梦州查明西泽秋氏身世，断云湖水底废墟祭祖并接受求婚；在南浦老宅与江澜拜堂结发大婚，迁居栖云镇闲居，点破阴阳灵气玄机，合修共撰《炁灵枢要》第二卷。"},{"id":"江澜","name":"江澜","group":"主角","size":"big","desc":"照元中后期（炁灵嫁接，意剑守无极，丹田纳阴阳），31岁。与秋月岚赴云梦州查明其身世，回南浦老宅拜堂结发大婚；迁居栖云镇独院闲居，参透无极与清气同源大道，与秋月岚共撰《炁灵枢要》第二卷。"},{"id":"凤","name":"崔凤","group":"主角","size":"big","desc":"照元后期巅峰，天影阁大管事，31岁。已返回云泽沉水州密室正式长闭关冲击天人境；离江南前下令暗哨齐掌柜备厚礼祝贺江澜小岚大婚，并来信开出海参鲍鱼大补食谱调侃江澜。"},{"id":"尘","name":"柳慕尘","group":"主角","size":"big","desc":"道种期/天人战力，天影阁阁主，31岁。玄黑织锦长袍；独身北上琅琊昭宇城接洽商洛灵游侠团，搭建天影阁北方暗哨网络。"},{"id":"秋紫","name":"秋紫","group":"重要配角","size":"mid","desc":"上古奇灵一族，养炁后期巅峰，化形十七岁少女。随江澜小岚回云梦寻根，见证二人南浦大婚；现常住南浦老宅给江怀瑾当杂铺‘小掌柜’，贪吃活泼，往返栖云小院送点心。"},{"id":"老庞","name":"老庞","group":"重要配角","size":"mid","desc":"青鸾州散修（照元中期），全名庞烈。随江澜追寻至碧落州赤阳古都秘境，出秘境后分得灵石尾款，爆料江澜不去青楼，后告别北上石崖州看望儿子。"},{"id":"商洛灵","name":"商洛灵","group":"重要配角","size":"mid","desc":"昭宇州凝脉中期女游侠。护航小岚深入赤阳古都，安溪镇结清酬劳并指点东南沿海黑市线索，后告别南下乡村探望弟弟小石头。"},{"id":"谢照薇","name":"谢照薇","group":"重要配角","size":"mid","desc":"琅琊世家嫡女，照元中期。在赤阳古都花园获小岚救下，调停与赤阳宫冲突，安溪镇透露东南沿海/东海岛屿古代炁修遗存线索。"},{"id":"薛宛辞","name":"薛宛辞","group":"重要配角","size":"mid","desc":"星罗台大长老，道种境大修，棕发深邃。早在二十年前观星象知天下大势，设茶局残棋预言第二轮灵气复苏浩劫，赠安清‘叁/肆’谶签。"},{"id":"晏舒","name":"晏舒","group":"配角","desc":"星罗台观星峰大弟子，照元后期。薛宛辞开山门弟子，设午宴款待安清，与柳泠感情融洽。"},{"id":"林远","name":"林远","group":"配角","desc":"天影阁连州暗哨头领，21岁，照元初期。崔凤破格提拔，管理茶楼与城外作坊明暗双据点，恪尽职守。"},{"id":"韩玉","name":"韩玉","group":"配角","desc":"天风山驻城长老兼州府典籍使，天人境（外貌四十来岁），身兼宗门与官府职差。在崇圣城藏书阁见江澜气脉特异问其是否当差，得知江澜有朋友师承且志在江湖后飘然离去。"},{"id":"郑桐","name":"郑桐","group":"配角","desc":"商洛灵猎妖团同伴，年轻散修。奉命东去青鸾州搜寻江澜，在界江渡口与西去的江澜错身擦肩。"},{"id":"方杏","name":"方杏","group":"配角","desc":"商洛灵猎妖团同伴，鹅蛋脸妹子，腰挂木算盘。奉命东去青鸾州搜寻江澜，在界江渡口与西去的江澜错身擦肩。"},{"id":"魏姝","name":"魏姝","group":"配角","desc":"青螺城魏家大小姐，十六岁，引气后期。看上江澜欲招为上门女婿挡相亲，被拒后傲娇送客。"},{"id":"乔知遥","name":"乔知遥","group":"重要配角","size":"mid","desc":"青澜宗弟子，顾长老门下。泠逃走后被留在京城，被勾去选妃名册，留充为司礼台典籍院女官。"},{"id":"云怀玉","name":"云怀玉","group":"重要配角","size":"mid","desc":"天影阁长老，天人境深处。尊称崔凤为“夫人”，对戴清宁尊称为“二夫人”，打理阁内要务。"},{"id":"温如意","name":"温如意","group":"重要配角","size":"mid","desc":"天影阁供奉，丁火天人境修士，地火殿掌管者。用文火阵法温养柳慕尘心脉。对戴清宁与柳泠像长辈姨娘般疼爱温厚。"},{"id":"裴浚","name":"裴浚","group":"配角","desc":"青澜宗长老，天人境。与云怀玉会面接受善后安排。对沈妙真说'泠儿往后不可能再回青澜宗'。"},{"id":"江怀瑾","name":"江怀瑾","group":"配角","desc":"江澜的父亲，南浦镇‘江记杂铺’老掌柜。在老宅为江澜与小岚操办拜堂结发大婚，给小岚厚重红封承诺护短；心疼小岚被围观，主动出资让小两口在镇外栖云独院闲居度日。"},{"id":"洪见微","name":"洪见微","group":"配角","desc":"海门螺港洪家九姑娘，凝脉后期巅峰。干练爽朗，独当一面调度码头，在茶棚为初抵海门的江澜秋月岚指路老布庄买防风绒帽。"},{"id":"戴承行","name":"戴承行","group":"家族","desc":"清宁的父亲，戴家家主。60岁，照元中期。"},{"id":"沈清漪","name":"沈清漪","group":"家族","desc":"清宁的母亲，55岁，气后。白发美人。深闺中倾听清宁不舍告白，极度支持并祝福女儿大婚。"},{"id":"戴景衔","name":"戴景衔","group":"重要配角","size":"mid","desc":"清宁的亲哥，天阙剑宗弟子，白发。27岁，照元中后期。大婚晨起叮嘱清宁不高兴就回家，接亲时郑重将妹妹托付给安。"},{"id":"戴承风","name":"戴承风","group":"家族","desc":"戴家三叔，55岁，照元中期。"},{"id":"戴承远","name":"戴承远","group":"家族","desc":"戴家大伯，75岁，照元中期。见天影阁免税大饼后抚掌大笑定下提亲。"},{"id":"戴清雪","name":"戴清雪","group":"家族","desc":"清宁的堂妹，感灵，19岁。已嫁入钱家。大婚前参与姐妹聚会与帮清宁妆扮。"},{"id":"戴清韵","name":"戴清韵","group":"家族","desc":"清宁的堂姐，27岁，凝脉前期。已出嫁陆家。带两岁半小侄子来帮清宁备婚。"},{"id":"戴景峥","name":"戴景峥","group":"家族","desc":"清宁的大堂哥，40岁，照元。管家族具体事务。"},{"id":"戴景舟","name":"戴景舟","group":"家族","desc":"清宁的堂弟（四叔独子），比清宁小7岁。清宁手把手教他理仓管账，后派驻临川货栈；提亲日热情称安为'安哥'并多说好话。"},{"id":"戴星阑","name":"戴星阑","group":"家族","desc":"景峥之子，清宁侄子，10岁。见清宁牵安的手大声狂喊'清宁姑姑带男人回来啦'。"},{"id":"戴若明","name":"戴若明","group":"家族","desc":"景峥幼女，清宁侄女，不到一岁。小名阿明。"},{"id":"周氏","name":"周氏","group":"家族","desc":"戴景峥之妻，堂嫂。普通修士家庭出身，凝脉中期。"},{"id":"戴承昭","name":"戴承昭","group":"家族","desc":"清宁的小叔，3 // --- D3 拓扑力导向图渲染 ---
const svg = d3.select("#svg");
const width = window.innerWidth - 480;
const height = window.innerHeight;

const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

const simulation = d3.forceSimulation(relationData.nodes)
  .force("link", d3.forceLink(relationData.links).id(d => d.id).distance(140))
  .force("charge", d3.forceManyBody().strength(-450))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(35));

const link = g.append("g").selectAll(".link")
  .data(relationData.links).enter().append("line")
  .attr("class", "link")
  .attr("stroke", d => d.color || "#3a3f4d")
  .attr("stroke-width", d => Math.sqrt(d.weight || 1) + 1.2);

const linkText = g.append("g").selectAll(".link-label")
  .data(relationData.links).enter().append("text")
  .attr("class", "link-label")
  .text(d => d.label || "");

const node = g.append("g").selectAll(".node")
  .data(relationData.nodes).enter().append("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended));

node.append("circle")
  .attr("r", d => d.size || 18)
  .attr("fill", d => d.color || "#5aa9ff");

node.append("text")
  .attr("dy", 32)
  .text(d => d.name);

const tip = document.getElementById("tip");
node.on("mouseover", (e, d) => {
  tip.style.display = "block";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY + 14) + "px";
  tip.innerHTML = `<div class="t">${d.name}</div><div>${d.desc || '暂无描述'}</div>`;
}).on("mouseout", () => {
  tip.style.display = "none";
});

simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  linkText
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2);

  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

function dragstarted(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) {
  d.fx = e.x; d.fy = e.y;
}
function dragended(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}
</script>
